<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Optical Test</title>

    <style>

        /* 移除所有邊距，背景設為黑色 */

        html, body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            background-color: #000000;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        /* 讓量測圖片完整填滿螢幕，不拉伸變形 */

        img {

            max-width: 100%;

            max-height: 100%;

            object-fit: contain;

        }

    </style>

</head>

<body>

    <!-- FullScreen_G.jpg -->

    <img src="FullScreen_G.jpg" alt="Optical Pattern">

</body>

</html>
